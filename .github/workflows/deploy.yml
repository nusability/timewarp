name: Deploy to GitHub Pages

# The site is fully static (no build step), so deployment is just mirroring
# the current tree to the gh-pages branch, which GitHub serves via Pages.
# (The actions/deploy-pages route needs Pages pre-enabled by a repo admin;
# a gh-pages branch enables Pages automatically.)

on:
  push:
    branches: [claude/spiral-timeline-viz-1sr0aq, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push current tree to gh-pages
        run: git push --force origin HEAD:gh-pages
